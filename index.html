// ============================================================================
// PERSISTENT STORAGE ENGINE (SSR-Safe + Sync localStorage/sessionStorage + IndexedDB Mirror)
// ============================================================================
const STORAGE_PREFIX = 'siakad_absensi_v3_';
const IDB_NAME = 'siakad_absensi_db';
const IDB_STORE = 'kv_store';

const openSiakadIDB = () => {
  return new Promise((resolve, reject) => {
    if (typeof window === 'undefined' || !window.indexedDB) {
      return reject(new Error('IndexedDB unavailable'));
    }
    try {
      const req = window.indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) {
      reject(e);
    }
  });
};

const idbGet = async (key) => {
  try {
    const db = await openSiakadIDB();
    return await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const req = store.get(`${STORAGE_PREFIX}${key}`);
      req.onsuccess = () => resolve(req.result !== undefined ? req.result : null);
      req.onerror = () => resolve(null);
    });
  } catch {
    return null;
  }
};

const idbSet = async (key, value) => {
  try {
    const db = await openSiakadIDB();
    await new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      const store = tx.objectStore(IDB_STORE);
      store.put(value, `${STORAGE_PREFIX}${key}`);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
    return true;
  } catch {
    return false;
  }
};

const getEmbeddedSeed = () => {
  if (typeof window === 'undefined') return null;
  if (window.__SIAKAD_EMBEDDED_CACHE__ !== undefined) return window.__SIAKAD_EMBEDDED_CACHE__;
  let parsed = null;
  // 1. Check URL Hash #sync=... for instant cross-device transfer
  try {
    if (window.location.hash && window.location.hash.startsWith('#sync=')) {
      const encoded = window.location.hash.slice('#sync='.length);
      const jsonStr = decodeURIComponent(escape(atob(encoded)));
      const syncData = JSON.parse(jsonStr);
      if (syncData && typeof syncData === 'object') {
        parsed = syncData;
      }
    }
  } catch {}
  // 2. Check embedded JSON seed baked into this HTML file
  if (!parsed) {
    try {
      const el = document.getElementById('siakad-embedded-seed');
      if (el && el.textContent && el.textContent.trim() !== 'null') {
        const seedObj = JSON.parse(el.textContent);
        if (seedObj && typeof seedObj === 'object') {
          parsed = seedObj;
        }
      }
    } catch {}
  }
  window.__SIAKAD_EMBEDDED_CACHE__ = parsed;
  return parsed;
};

const hasPersistedValue = (key) => {
  if (typeof window === 'undefined') return false;
  const fullKey = `${STORAGE_PREFIX}${key}`;
  try {
    if (window.localStorage.getItem(fullKey) !== null) return true;
  } catch {}
  try {
    if (window.sessionStorage.getItem(fullKey) !== null) return true;
  } catch {}
  try {
    if (window.name && window.name.startsWith('SIAKAD_STORE:')) {
      const store = JSON.parse(window.name.slice('SIAKAD_STORE:'.length));
      if (store && key in store) return true;
    }
  } catch {}
  const seed = getEmbeddedSeed();
  if (seed && key in seed) return true;
  return false;
};

const readPersistedValue = (key, fallback) => {
  if (typeof window !== 'undefined') {
    const fullKey = `${STORAGE_PREFIX}${key}`;
    // Priority 1: URL #sync= hash (explicit cross-device import)
    try {
      if (window.location.hash && window.location.hash.startsWith('#sync=')) {
        const seed = getEmbeddedSeed();
        if (seed && key in seed) return seed[key];
      }
    } catch {}
    // Priority 2: LocalStorage
    try {
      const raw = window.localStorage.getItem(fullKey);
      if (raw !== null) return JSON.parse(raw);
    } catch {}
    // Priority 3: SessionStorage
    try {
      const rawSession = window.sessionStorage.getItem(fullKey);
      if (rawSession !== null) return JSON.parse(rawSession);
    } catch {}
    // Priority 4: window.name
    try {
      if (window.name && window.name.startsWith('SIAKAD_STORE:')) {
        const store = JSON.parse(window.name.slice('SIAKAD_STORE:'.length));
        if (store && key in store) return store[key];
      }
    } catch {}
    // Priority 5: Baked-in HTML Seed (for uploaded HTML opened on a new device)
    try {
      const seed = getEmbeddedSeed();
      if (seed && key in seed) return seed[key];
    } catch {}
  }
  return typeof fallback === 'function' ? fallback() : fallback;
};

const writePersistedValue = (key, value) => {
  if (typeof window === 'undefined') return false;
  const fullKey = `${STORAGE_PREFIX}${key}`;
  const serialized = JSON.stringify(value);
  let savedLocal = false;
  let savedSession = false;
  try {
    window.localStorage.setItem(fullKey, serialized);
    savedLocal = true;
  } catch {}
  try {
    window.sessionStorage.setItem(fullKey, serialized);
    savedSession = true;
  } catch {}
  try {
    let store = {};
    if (window.name && window.name.startsWith('SIAKAD_STORE:')) {
      store = JSON.parse(window.name.slice('SIAKAD_STORE:'.length)) || {};
    }
    store[key] = value;
    window.name = 'SIAKAD_STORE:' + JSON.stringify(store);
  } catch {}
  idbSet(key, value);
  return savedLocal || savedSession;
};

const getDeviceId = () => {
  try {
    let id = window.localStorage.getItem(STORAGE_PREFIX + '__device_id__');
    if (!id) {
      id = 'dev_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36);
      window.localStorage.setItem(STORAGE_PREFIX + '__device_id__', id);
    }
    return id;
  } catch {
    return 'dev_' + Math.random().toString(36).slice(2, 10);
  }
};

const getAutoSyncRoomId = () => {
  try {
    const host = (window.location.hostname || 'siakad-local').toLowerCase().replace(/[^a-z0-9.-]/g, '');
    const path = (window.location.pathname || '/').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 24);
    return `siakad_autosync_v4_${host}_${path || 'root'}`;
  } catch {
    return 'siakad_autosync_v4_default';
  }
};

const readSyncMeta = () => readPersistedValue('__sync_meta__', {});
const writeSyncMeta = (meta) => writePersistedValue('__sync_meta__', meta);

const fetchWithRetry = async (url, options = {}, retries = 2) => {
  let lastErr = null;
  for (let i = 0; i <= retries; i++) {
    try {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res;
    } catch (err) {
      lastErr = err;
      if (i < retries) {
        await new Promise(r => setTimeout(r, 800 * (i + 1)));
      }
    }
  }
  throw lastErr;
};

const sanitizeForSync = (key, value) => {
  if (key === 'settings' && value && typeof value === 'object') {
    if (value.logoUrl && value.logoUrl.length > 12000) {
      return { ...value, logoUrl: '' };
    }
  }
  return value;
};

const detectStorageMode = () => {
  if (typeof window === 'undefined') return 'memory';
  try {
    const testKey = `${STORAGE_PREFIX}__test__`;
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    return 'localStorage';
  } catch {}
  try {
    const testKey = `${STORAGE_PREFIX}__test__`;
    window.sessionStorage.setItem(testKey, '1');
    window.sessionStorage.removeItem(testKey);
    return 'sessionStorage';
  } catch {}
  return 'memory';
};

function usePersistedState(key, initialValue) {
  const [state, setState] = useState(() => readPersistedValue(key, initialValue));
  const isHydratedRef = useRef(false);

  // Hydrate safely on client mount (covers SSR/Next.js or IndexedDB fallback) without overwriting saved data
  useEffect(() => {
    let active = true;
    if (hasPersistedValue(key)) {
      const existing = readPersistedValue(key, initialValue);
      setState(existing);
      isHydratedRef.current = true;
    } else {
      idbGet(key).then((idbVal) => {
        if (!active) return;
        if (idbVal !== null && idbVal !== undefined) {
          setState(idbVal);
          try {
            window.localStorage.setItem(`${STORAGE_PREFIX}${key}`, JSON.stringify(idbVal));
          } catch {}
        }
        isHydratedRef.current = true;
      });
    }
    return () => { active = false; };
  }, [key]);

  const setPersistedState = useCallback((updater) => {
    setState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      writePersistedValue(key, next);
      return next;
    });
  }, [key]);

  return [state, setPersistedState];
}

// Compress uploaded image via Canvas so localStorage never hits QuotaExceededError
const compressImageFile = (file, maxDim = 256) => {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (ev) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/webp', 0.82));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
};

// ============================================================================
// UTILITY: ISO/IEC 18004 QR CODE ENCODER (Version 2, 25x25, ECC Level L)
// ============================================================================
const computeQRMatrix = (value = "SIAKAD-QR") => {
  const str = String(value || "SIAKAD").trim();
  const utf8 = [];
  for (let i = 0; i < str.length; i++) {
    utf8.push(str.charCodeAt(i) & 0xff);
  }
  const dataBytes = utf8.slice(0, 32);
  const totalDataCodewords = 34;
  const ecCodewordsCount = 10;
  const size = 25;

  const bits = [];
  const pushBits = (val, len) => {
    for (let i = len - 1; i >= 0; i--) {
      bits.push((val >>> i) & 1);
    }
  };
  pushBits(0b0100, 4);
  pushBits(dataBytes.length, 8);
  for (const b of dataBytes) pushBits(b, 8);
  pushBits(0, Math.min(4, totalDataCodewords * 8 - bits.length));
  while (bits.length % 8 !== 0) bits.push(0);

  const codewords = [];
  for (let i = 0; i < bits.length; i += 8) {
    let byte = 0;
    for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
    codewords.push(byte);
  }
  const padBytes = [0xec, 0x11];
  let padIdx = 0;
  while (codewords.length < totalDataCodewords) {
    codewords.push(padBytes[padIdx % 2]);
    padIdx++;
  }

  const gfExp = new Uint8Array(512);
  const gfLog = new Uint8Array(256);
  let x = 1;
  for (let i = 0; i < 255; i++) {
    gfExp[i] = x;
    gfLog[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) gfExp[i] = gfExp[i - 255];

  const gfMul = (a, b) => (a === 0 || b === 0 ? 0 : gfExp[gfLog[a] + gfLog[b]]);

  let gen = [1];
  for (let i = 0; i < ecCodewordsCount; i++) {
    const next = new Array(gen.length + 1).fill(0);
    for (let j = 0; j < gen.length; j++) {
      next[j] ^= gen[j];
      next[j + 1] ^= gfMul(gen[j], gfExp[i]);
    }
    gen = next;
  }

  const msgPoly = new Uint8Array(totalDataCodewords + ecCodewordsCount);
  msgPoly.set(codewords, 0);
  for (let i = 0; i < totalDataCodewords; i++) {
    const coef = msgPoly[i];
    if (coef !== 0) {
      for (let j = 1; j < gen.length; j++) {
        msgPoly[i + j] ^= gfMul(gen[j], coef);
      }
    }
  }
  const ecCodewords = Array.from(msgPoly.slice(totalDataCodewords));
  const allCodewords = [...codewords, ...ecCodewords];

  const grid = Array(size).fill(null).map(() => Array(size).fill(false));
  const reserved = Array(size).fill(null).map(() => Array(size).fill(false));

  const setModule = (r, c, val, isFunc = true) => {
    if (r >= 0 && r < size && c >= 0 && c < size) {
      grid[r][c] = Boolean(val);
      if (isFunc) reserved[r][c] = true;
    }
  };

  const drawFinder = (r0, c0) => {
    for (let r = -1; r <= 7; r++) {
      for (let c = -1; c <= 7; c++) {
        const rr = r0 + r;
        const cc = c0 + c;
        if (rr >= 0 && rr < size && cc >= 0 && cc < size) {
          const inBox = r >= 0 && r <= 6 && c >= 0 && c <= 6;
          const isDark = inBox && (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4));
          setModule(rr, cc, isDark, true);
        }
      }
    }
  };
  drawFinder(0, 0);
  drawFinder(0, size - 7);
  drawFinder(size - 7, 0);

  for (let r = -2; r <= 2; r++) {
    for (let c = -2; c <= 2; c++) {
      const isDark = Math.max(Math.abs(r), Math.abs(c)) !== 1;
      setModule(18 + r, 18 + c, isDark, true);
    }
  }

  for (let i = 8; i < size - 8; i++) {
    if (!reserved[6][i]) setModule(6, i, i % 2 === 0, true);
    if (!reserved[i][6]) setModule(i, 6, i % 2 === 0, true);
  }

  setModule(size - 8, 8, true, true);
  for (let i = 0; i < 9; i++) {
    if (i !== 6) {
      reserved[8][i] = true;
      reserved[i][8] = true;
    }
  }
  for (let i = 0; i < 8; i++) {
    reserved[8][size - 1 - i] = true;
    reserved[size - 1 - i][8] = true;
  }

  const allBits = [];
  for (const cw of allCodewords) {
    for (let b = 7; b >= 0; b--) allBits.push((cw >>> b) & 1);
  }

  let bitIdx = 0;
  let upward = true;
  for (let rightCol = size - 1; rightCol >= 1; rightCol -= 2) {
    if (rightCol === 6) rightCol = 5;
    for (let vert = 0; vert < size; vert++) {
      const r = upward ? size - 1 - vert : vert;
      for (let cOffset = 0; cOffset < 2; cOffset++) {
        const c = rightCol - cOffset;
        if (!reserved[r][c]) {
          const dataBit = bitIdx < allBits.length ? allBits[bitIdx++] === 1 : false;
          const maskedBit = (r + c) % 2 === 0 ? !dataBit : dataBit;
          grid[r][c] = maskedBit;
        }
      }
    }
    upward = !upward;
  }

  const formatBits = 0x77c4;
  const fBits = [];
  for (let i = 0; i < 15; i++) fBits.push(((formatBits >>> i) & 1) === 1);

  const tlCoords = [
    [8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8],
    [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]
  ];
  tlCoords.forEach(([r, c], idx) => { grid[r][c] = fBits[14 - idx]; });

  for (let i = 0; i < 7; i++) grid[size - 1 - i][8] = fBits[14 - i];
  for (let i = 7; i < 15; i++) grid[8][size - 15 + i] = fBits[14 - i];

  return grid;
};

const QRCodeMatrix = ({ value = "SIAKAD-QR", size = 140, fgColor = "#0f172a", bgColor = "#ffffff" }) => {
  const matrix = useMemo(() => computeQRMatrix(value), [value]);
  const gridSize = matrix.length;
  const quietZone = 3;
  const totalModules = gridSize + quietZone * 2;
  const cellSize = size / totalModules;

  return (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width={size}
      height={size}
      viewBox={`0 0 ${size} ${size}`}
      shapeRendering="crispEdges"
      style={{ WebkitPrintColorAdjust: "exact", printColorAdjust: "exact" }}
      className="rounded-lg border border-slate-200 bg-white shadow-inner shrink-0"
    >
      <rect width={size} height={size} fill={bgColor} />
      {matrix.map((row, rIdx) =>
        row.map((cell, cIdx) =>
          cell ? (
            <rect
              key={`${rIdx}-${cIdx}`}
              x={(cIdx + quietZone) * cellSize}
              y={(rIdx + quietZone) * cellSize}
              width={cellSize + 0.15}
              height={cellSize + 0.15}
              fill={fgColor}
            />
          ) : null
        )
      )}
    </svg>
  );
};

const playScanSound = (type = 'success', enabled = true) => {
  if (!enabled) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    const now = ctx.currentTime;
    if (type === 'success') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'warning' || type === 'late') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.setValueAtTime(440, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(160, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  } catch {}
};

const WeeklyAttendanceSVGChart = ({ data = [] }) => {
  const maxVal = Math.max(10, ...data.map(d => Math.max(d.Hadir || 0, d.Terlambat || 0, d.IzinSakit || 0, d.Alpa || 0)));
  return (
    <div className="flex h-full w-full flex-col justify-between pt-2">
      <div className="grid grid-cols-5 gap-3 items-end h-52 border-b border-slate-200 px-2 pb-2">
        {data.map((item, idx) => {
          const hHadir = Math.round(((item.Hadir || 0) / maxVal) * 100);
          const hLate = Math.round(((item.Terlambat || 0) / maxVal) * 100);
          const hIzin = Math.round(((item.IzinSakit || 0) / maxVal) * 100);
          const hAlpa = Math.round(((item.Alpa || 0) / maxVal) * 100);
          return (
            <div key={idx} className="flex flex-col items-center h-full justify-end group">
              <div className="flex items-end justify-center gap-1 sm:gap-1.5 w-full h-44">
                <div style={{ height: `${Math.max(6, hHadir)}%` }} className="w-3 sm:w-4 rounded-t-md bg-blue-600 transition-all duration-500" title={`Hadir: ${item.Hadir}`} />
                <div style={{ height: `${Math.max(4, hLate)}%` }} className="w-2.5 sm:w-3.5 rounded-t-md bg-amber-500 transition-all duration-500" title={`Terlambat: ${item.Terlambat}`} />
                <div style={{ height: `${Math.max(4, hIzin)}%` }} className="w-2.5 sm:w-3.5 rounded-t-md bg-cyan-500 transition-all duration-500" title={`Izin/Sakit: ${item.IzinSakit}`} />
                <div style={{ height: `${Math.max(4, hAlpa)}%` }} className="w-2.5 sm:w-3.5 rounded-t-md bg-rose-500 transition-all duration-500" title={`Alpa: ${item.Alpa}`} />
              </div>
              <span className="mt-2 text-[11px] font-bold text-slate-600">{item.day}</span>
            </div>
          );
        })}
      </div>
      <div className="mt-3 flex flex-wrap items-center justify-center gap-4 text-xs">
        <span className="flex items-center gap-1.5 font-semibold text-slate-600"><span className="h-2.5 w-2.5 rounded-xs bg-blue-600" /> Hadir</span>
        <span className="flex items-center gap-1.5 font-semibold text-slate-600"><span className="h-2.5 w-2.5 rounded-xs bg-amber-500" /> Terlambat</span>
        <span className="flex items-center gap-1.5 font-semibold text-slate-600"><span className="h-2.5 w-2.5 rounded-xs bg-cyan-500" /> Izin / Sakit</span>
        <span className="flex items-center gap-1.5 font-semibold text-slate-600"><span className="h-2.5 w-2.5 rounded-xs bg-rose-500" /> Alpa</span>
      </div>
    </div>
  );
};

const DonutAttendanceSVG = ({ data = [], rate = 0 }) => {
  const total = data.reduce((acc, d) => acc + d.value, 0) || 1;
  const radius = 58;
  const circumference = 2 * Math.PI * radius;
  let accumulatedAngle = 0;

  return (
    <div className="relative flex items-center justify-center h-52 w-full">
      <svg width="160" height="160" viewBox="0 0 160 160" className="-rotate-90">
        <circle cx="80" cy="80" r={radius} fill="transparent" stroke="#f1f5f9" strokeWidth="18" />
        {data.map((slice, i) => {
          const pct = slice.value / total;
          const strokeDasharray = `${pct * circumference} ${circumference}`;
          const strokeDashoffset = -accumulatedAngle * circumference;
          accumulatedAngle += pct;
          return (
            <circle
              key={i}
              cx="80"
              cy="80"
              r={radius}
              fill="transparent"
              stroke={slice.color}
              strokeWidth="18"
              strokeDasharray={strokeDasharray}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="butt"
            />
          );
        })}
      </svg>
      <div className="absolute flex flex-col items-center justify-center text-center">
        <span className="text-xl font-extrabold text-slate-900">{rate}%</span>
        <span className="text-[10px] font-bold uppercase text-slate-400">Kehadiran</span>
      </div>
    </div>
  );
};

const MonthlyTrendSVG = ({ data = [] }) => {
  const points = data.map((d, idx) => {
    const x = 30 + idx * 75;
    const y = 110 - ((d.persentase - 70) / 30) * 85;
    return `${x},${Math.max(15, Math.min(110, y))}`;
  }).join(" ");
  const areaPoints = `30,115 ${points} 255,115`;

  return (
    <svg viewBox="0 0 285 135" className="w-full h-36 overflow-visible">
      <defs>
        <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.35" />
          <stop offset="100%" stopColor="#06b6d4" stopOpacity="0.0" />
        </linearGradient>
      </defs>
      <line x1="25" y1="25" x2="265" y2="25" stroke="#f1f5f9" strokeDasharray="3 3" />
      <line x1="25" y1="65" x2="265" y2="65" stroke="#f1f5f9" strokeDasharray="3 3" />
      <line x1="25" y1="115" x2="265" y2="115" stroke="#e2e8f0" />
      <polygon points={areaPoints} fill="url(#trendGrad)" />
      <polyline fill="none" stroke="#06b6d4" strokeWidth="3" points={points} strokeLinecap="round" strokeLinejoin="round" />
      {data.map((d, idx) => {
        const x = 30 + idx * 75;
        const y = 110 - ((d.persentase - 70) / 30) * 85;
        return (
          <g key={idx}>
            <circle cx={x} cy={y} r="4.5" fill="#ffffff" stroke="#0891b2" strokeWidth="2.5" />
            <text x={x} y={y - 9} textAnchor="middle" className="fill-slate-700 text-[10px] font-bold">{d.persentase}%</text>
            <text x={x} y={130} textAnchor="middle" className="fill-slate-400 text-[9px] font-semibold">{d.minggu}</text>
          </g>
        );
      })}
    </svg>
  );
};

const LiveClockBadge = () => {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => {
    const timer = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);

  const clockStr = new Intl.DateTimeFormat('id-ID', {
    timeZone: 'Asia/Jakarta',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  }).format(now).replace(/\./g, ':') + " WIB";

  return (
    <div className="hidden md:flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs font-mono font-bold text-slate-800">
      <Clock className="h-3.5 w-3.5 text-blue-600" />
      {clockStr}
    </div>
  );
};

                        <div className="flex items-center gap-3">

                            alt={rec.studentName}
                            className="h-9 w-9 rounded-full object-cover ring-2 ring-slate-100"

                          <div>
                            <div className="font-semibold text-slate-900">{rec.studentName}</div>
                            <div className="text-xs text-slate-500">NIS: {rec.nis}</div>
                          </div>
                        </div>
                      </td>
                      <td className="py-3 px-3">
                        <span className="rounded-md bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700">

                {lateStudentsToday.map(item => (

                    <div>

          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <h3 className="text-sm font-bold text-slate-900 mb-1">Tren Kehadiran Bulanan (%)</h3>
            <p className="text-xs text-slate-500 mb-3">Rata-rata kehadiran 4 minggu terakhir</p>
            <MonthlyTrendSVG data={monthlyTrendData} />

}

// ============================================================================
// TOP-LEVEL MODULE 2: SCAN QR CODE ABSENSI
// ============================================================================
function ScanQRView({
  settings, students, attendance, todayAttendance, todayStr,
  setAttendance, currentUser, currentRole, addActivityLog, addNotification,
  showToast, setActiveMenu
}) {
  const [scanMode, setScanMode] = useState("masuk");
  const [cameraActive, setCameraActive] = useState(false);
  const [cameraStarting, setCameraStarting] = useState(false);
  const [cameraFacing, setCameraFacing] = useState("environment");
  const [availableCameras, setAvailableCameras] = useState([]);
  const [selectedDeviceId, setSelectedDeviceId] = useState("");
  const [soundEnabled, setSoundEnabled] = useState(true);
  const [manualToken, setManualToken] = useState("");
  const [scanResult, setScanResult] = useState(null);
  const [cameraError, setCameraError] = useState(null);
  const [simulateLateTime, setSimulateLateTime] = useState(false);
  const [frameScanCount, setFrameScanCount] = useState(0);

  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const scanIntervalRef = useRef(null);
  const qrImageInputRef = useRef(null);
  const processQRTokenRef = useRef(null);
  const lastScannedRef = useRef({ token: "", time: 0 });

  const stopCamera = useCallback(() => {
    if (scanIntervalRef.current) {
      clearInterval(scanIntervalRef.current);
      scanIntervalRef.current = null;
    }
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(track => track.stop());
      streamRef.current = null;
    }
    if (videoRef.current) {
      videoRef.current.srcObject = null;
    }
    setCameraActive(false);
    setCameraStarting(false);
  }, []);

  useEffect(() => {
    if (!window.jsQR) {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
      script.async = true;
      document.body.appendChild(script);
    }
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      navigator.mediaDevices.enumerateDevices()
        .then(devices => setAvailableCameras(devices.filter(d => d.kind === "videoinput")))
        .catch(() => {});
    }
    return () => stopCamera();
  }, [stopCamera]);

  const startCamera = async (overrideFacing = null, overrideDeviceId = null) => {
    stopCamera();
    setCameraError(null);
    setCameraStarting(true);

    const targetFacing = overrideFacing || cameraFacing;
    const targetDevice = overrideDeviceId !== null ? overrideDeviceId : selectedDeviceId;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setCameraStarting(false);
      setCameraError("Browser ini tidak mendukung akses WebRTC getUserMedia. Gunakan Upload Foto QR atau Simulator di kanan.");
      return;
    }

    const constraintCandidates = [
      ...(targetDevice ? [{ video: { deviceId: { exact: targetDevice }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }] : []),
      { video: { facingMode: { ideal: targetFacing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: targetFacing }, audio: false },
      { video: true, audio: false }
    ];

    let acquiredStream = null;
    let lastErr = null;

    for (const constraints of constraintCandidates) {
      try {
        acquiredStream = await navigator.mediaDevices.getUserMedia(constraints);
        if (acquiredStream) break;
      } catch (err) {
        lastErr = err;
      }
    }

    if (!acquiredStream) {
      setCameraStarting(false);
      setCameraActive(false);
      const msg = lastErr?.name === "NotAllowedError"
        ? "Izin kamera ditolak oleh browser. Klik ikon gembok/kamera di address bar untuk mengizinkan kamera, atau gunakan tombol 'Scan Foto QR'."
        : "Kamera perangkat tidak ditemukan atau sedang dipakai aplikasi lain. Anda tetap dapat menggunakan fitur 'Scan Foto QR' atau Simulator Cepat.";
      setCameraError(msg);
      return;
    }

    streamRef.current = acquiredStream;

    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      setAvailableCameras(devices.filter(d => d.kind === "videoinput"));
    } catch {}

    if (videoRef.current) {
      videoRef.current.srcObject = acquiredStream;
      videoRef.current.setAttribute("playsinline", "true");
      videoRef.current.muted = true;
      try {
        await videoRef.current.play();
      } catch {}
    }

    setCameraActive(true);
    setCameraStarting(false);

    let nativeDetector = null;
    if ('BarcodeDetector' in window) {
      try {
        nativeDetector = new window.BarcodeDetector({ formats: ['qr_code'] });
      } catch {}
    }

    scanIntervalRef.current = setInterval(async () => {
      if (!videoRef.current || videoRef.current.readyState < 2) return;
      setFrameScanCount(c => c + 1);

      const triggerDecoded = (rawVal) => {
        const clean = String(rawVal || "").trim();
        if (!clean) return;
        const nowMs = Date.now();
        if (lastScannedRef.current.token === clean && nowMs - lastScannedRef.current.time < 2500) {
          return;
        }
        lastScannedRef.current = { token: clean, time: nowMs };
        if (processQRTokenRef.current) {
          processQRTokenRef.current(clean);
        }
      };

      try {
        if (nativeDetector) {
          const barcodes = await nativeDetector.detect(videoRef.current);
          if (barcodes.length > 0 && barcodes[0].rawValue) {
            triggerDecoded(barcodes[0].rawValue);
            return;
          }
        }

        if (window.jsQR && canvasRef.current) {
          const video = videoRef.current;
          const canvas = canvasRef.current;
          const vw = video.videoWidth || 640;
          const vh = video.videoHeight || 480;
          canvas.width = vw;
          canvas.height = vh;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(video, 0, 0, vw, vh);

          const fullData = ctx.getImageData(0, 0, vw, vh);
          const fullCode = window.jsQR(fullData.data, fullData.width, fullData.height, {
            inversionAttempts: "attemptBoth"
          });
          if (fullCode && fullCode.data) {
            triggerDecoded(fullCode.data);
            return;
          }

          const cropSize = Math.floor(Math.min(vw, vh) * 0.65);
          const sx = Math.floor((vw - cropSize) / 2);
          const sy = Math.floor((vh - cropSize) / 2);
          if (cropSize > 80) {
            const cropData = ctx.getImageData(sx, sy, cropSize, cropSize);
            const cropCode = window.jsQR(cropData.data, cropData.width, cropData.height, {
              inversionAttempts: "attemptBoth"
            });
            if (cropCode && cropCode.data) {
              triggerDecoded(cropCode.data);
              return;
            }
          }
        }
      } catch {}
    }, 300);
  };

  const handleScanFromImage = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        if (!canvasRef.current) return;
        const canvas = canvasRef.current;
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, img.width, img.height);
        if (window.jsQR) {
          const decoded = window.jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: "attemptBoth"
          });
          if (decoded && decoded.data) {
            if (processQRTokenRef.current) processQRTokenRef.current(decoded.data);
            return;
          }
        }
        showToast("QR Code pada gambar tidak terbaca jelas, pastikan bagian QR terlihat utuh.", "warning");
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  };

  const processQRToken = (rawToken) => {
    const cleanToken = String(rawToken || "").trim();
    if (!cleanToken) return;

    const matchedStudent = students.find(s => {
      const tok = s.qrToken.toLowerCase();
      const inputLow = cleanToken.toLowerCase();
      return (
        tok === inputLow ||
        inputLow.includes(tok) ||
        inputLow.includes(s.id.toLowerCase()) ||
        s.nis === cleanToken ||
        s.nisn === cleanToken
      );
    });

    const currentTimeStr = simulateLateTime ? "07:28:15" : getNowTimeHMS();

    if (!matchedStudent) {
      playScanSound('error', soundEnabled);
      setScanResult({
        type: 'error',
        title: 'QR CODE TIDAK DIKENAL / TIDAK VALID',
        subtitle: `Kode "${cleanToken}" berhasil dibaca namun tidak terdaftar di database peserta didik.`,
        student: null,
        timestamp: currentTimeStr
      });
      addActivityLog("Gagal Scan QR (Token Tidak Dikenal)", cleanToken, "Scan QR");
      showToast(`QR Terbaca (${cleanToken}), tetapi tidak terdaftar di data siswa`, "warning");
      return;
    }

    if (matchedStudent.status !== "Aktif") {
      playScanSound('error', soundEnabled);
      setScanResult({
        type: 'error',
        title: 'STATUS PESERTA DIDIK NONAKTIF',
        subtitle: `${matchedStudent.name} berstatus nonaktif.`,
        student: matchedStudent,
        timestamp: currentTimeStr
      });
      return;
    }

    const existingRecord = attendance.find(
      a => a.date === todayStr && a.studentId === matchedStudent.id
    );

    if (scanMode === "masuk") {
      if (existingRecord && (existingRecord.status === "Hadir" || existingRecord.status === "Terlambat")) {
        playScanSound('warning', soundEnabled);
        setScanResult({
          type: 'duplicate',
          title: 'PESERTA DIDIK SUDAH MELAKUKAN ABSENSI HARI INI',
          subtitle: `Tercatat masuk pukul ${existingRecord.timeIn} WIB dengan status ${existingRecord.status}. Data sudah ada di Laporan.`,
          student: matchedStudent,
          record: existingRecord,
          timestamp: currentTimeStr
        });
        showToast(`${matchedStudent.name} sudah tercatat absen hari ini (${existingRecord.status})`, "info");
        return;
      }

      const [batasH, batasM] = settings.batasTerlambat.split(':').map(Number);
      const [scanH, scanM] = currentTimeStr.split(':').map(Number);
      const isLate = (scanH * 60 + scanM) > (batasH * 60 + batasM);
      const computedStatus = isLate ? "Terlambat" : "Hadir";
      const diffMinutes = Math.max(1, (scanH * 60 + scanM) - (batasH * 60 + batasM));
      const noteText = isLate
        ? `Terlambat ${diffMinutes} menit (Batas ${settings.batasTerlambat})`
        : "Tepat Waktu (Scan Kamera QR)";

      const newRecord = {
        id: `ATT-${Date.now().toString().slice(-5)}`,
        date: todayStr,
        studentId: matchedStudent.id,
        nis: matchedStudent.nis,
        studentName: matchedStudent.name,
        className: matchedStudent.className,
        major: matchedStudent.major,
        timeIn: currentTimeStr,
        timeOut: "-",
        status: computedStatus,
        note: noteText,
        scannerBy: `${currentUser?.name || currentRole}`
      };

      setAttendance(prev => {
        const exists = prev.some(a => a.date === todayStr && a.studentId === matchedStudent.id);
        if (exists) {
          return prev.map(a => (a.date === todayStr && a.studentId === matchedStudent.id ? newRecord : a));
        }
        return [newRecord, ...prev];
      });

      playScanSound(isLate ? 'late' : 'success', soundEnabled);
      setScanResult({
        type: isLate ? 'late' : 'success',
        title: isLate ? 'ABSENSI TERCATAT — PESERTA DIDIK TERLAMBAT' : 'ABSENSI MASUK BERHASIL & TERSIMPAN',
        subtitle: `${noteText}. Data otomatis tersimpan ke Rekap Laporan & WA Wali (${matchedStudent.parentPhone}).`,
        student: matchedStudent,
        record: newRecord,
        timestamp: currentTimeStr
      });

      addActivityLog(`Scan QR Absensi Masuk (${computedStatus})`, `${matchedStudent.name} (${matchedStudent.className})`, "Scan QR");
      addNotification(
        `Scan QR Berhasil: ${matchedStudent.name}`,
        `Tercatat ${computedStatus} pukul ${currentTimeStr} WIB dan otomatis masuk ke Laporan Kehadiran.`,
        isLate ? "late" : "success"
      );
      showToast(`Berhasil Scan: ${matchedStudent.name} (${computedStatus}) — Tersimpan!`);
    } else {
      const updatedRecord = existingRecord
        ? { ...existingRecord, timeOut: currentTimeStr, note: `${existingRecord.note} • Pulang ${currentTimeStr}` }
        : {
            id: `ATT-${Date.now().toString().slice(-5)}`,
            date: todayStr,
            studentId: matchedStudent.id,
            nis: matchedStudent.nis,
            studentName: matchedStudent.name,
            className: matchedStudent.className,
            major: matchedStudent.major,
            timeIn: settings.jamMasuk,
            timeOut: currentTimeStr,
            status: "Hadir",
            note: `Scan Pulang (${currentTimeStr})`,
            scannerBy: `${currentUser?.name || currentRole}`
          };

      setAttendance(prev => {
        const exists = prev.some(a => a.date === todayStr && a.studentId === matchedStudent.id);
        if (exists) {
          return prev.map(a => (a.date === todayStr && a.studentId === matchedStudent.id ? updatedRecord : a));
        }
        return [updatedRecord, ...prev];
      });

      playScanSound('success', soundEnabled);
      setScanResult({
        type: 'success',
        title: 'ABSENSI PULANG BERHASIL DICATAT & TERSIMPAN',
        subtitle: `Jam pulang tercatat pukul ${currentTimeStr} WIB. Laporan kehadiran otomatis diperbarui.`,
        student: matchedStudent,
        record: updatedRecord,
        timestamp: currentTimeStr
      });
      addActivityLog("Scan QR Absensi Pulang", `${matchedStudent.name} (${matchedStudent.className})`, "Scan QR");
      showToast(`Absen Pulang ${matchedStudent.name} berhasil disimpan!`);
    }
  };

  processQRTokenRef.current = processQRToken;

  const bannerStyles = {
    success: "border-emerald-500 bg-emerald-50 text-emerald-950",
    late: "border-amber-500 bg-amber-50 text-amber-950",
    duplicate: "border-yellow-400 bg-yellow-50 text-yellow-950",
    error: "border-rose-500 bg-rose-50 text-rose-950",
  };

  return (
    <div className="space-y-6">
      <div className="flex flex-col justify-between gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm lg:flex-row lg:items-center">
        <div>
          <div className="flex items-center gap-2">
            <span className="inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500 animate-ping" />
            <span className="text-xs font-bold uppercase tracking-wider text-blue-600">Terminal Pemindaian QR Real-Time</span>
          </div>
          <h2 className="mt-1 text-xl font-bold text-slate-900">Scan QR Code Absensi Peserta Didik</h2>
          <p className="text-xs text-slate-500">
            Jam Masuk: <strong>{settings.jamMasuk} WIB</strong> • Batas Terlambat: <strong>{settings.batasTerlambat} WIB</strong> • Jam Pulang: <strong>{settings.jamPulang} WIB</strong>
          </p>
        </div>

        <div className="flex flex-wrap items-center gap-2.5">
          <div className="inline-flex rounded-xl bg-slate-100 p-1">
            <button
              type="button"
              onClick={() => setScanMode("masuk")}
              className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${
                scanMode === "masuk" ? "bg-blue-600 text-white shadow" : "text-slate-600 hover:text-slate-900"
              }`}
            >
              Sesi Absen Masuk
            </button>
            <button
              type="button"
              onClick={() => setScanMode("pulang")}
              className={`rounded-lg px-3.5 py-1.5 text-xs font-bold transition ${
                scanMode === "pulang" ? "bg-blue-600 text-white shadow" : "text-slate-600 hover:text-slate-900"
              }`}
            >
              Sesi Absen Pulang
            </button>
          </div>

          <button
            type="button"
            onClick={() => setSimulateLateTime(!simulateLateTime)}
            className={`flex items-center gap-1.5 rounded-xl border px-3 py-2 text-xs font-semibold transition ${
              simulateLateTime
                ? "border-amber-300 bg-amber-100 text-amber-900"
                : "border-slate-200 bg-white text-slate-600 hover:bg-slate-50"
            }`}
          >
            <Clock className="h-3.5 w-3.5" />
            {simulateLateTime ? "Simulasi Jam: 07:28 (Terlambat)" : "Waktu: Real-Time WIB"}
          </button>

          <button
            type="button"
            onClick={() => setSoundEnabled(!soundEnabled)}
            className="flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50"
          >
            {soundEnabled ? <Volume2 className="h-4 w-4 text-blue-600" /> : <VolumeX className="h-4 w-4 text-slate-400" />}
            {soundEnabled ? "Suara Beep Aktif" : "Mute"}
          </button>
        </div>
      </div>

      <div className="grid grid-cols-1 gap-6 lg:grid-cols-12">
        <div className="space-y-4 lg:col-span-7">
          <div className="overflow-hidden rounded-2xl border border-slate-200 bg-slate-950 text-white shadow-lg">
            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 px-4 py-3">
              <div className="flex items-center gap-2">
                <span className={`h-2.5 w-2.5 rounded-full ${cameraActive ? 'bg-emerald-400 animate-pulse' : 'bg-slate-500'}`} />
                <span className="text-xs font-semibold tracking-wide text-slate-300">
                  {cameraActive ? "KAMERA AKTIF MEMINDAI QR CODE..." : cameraStarting ? "MENGHUBUNGKAN KAMERA PERANGKAT..." : "KAMERA SIAP DIAKTIFKAN"}
                </span>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                {availableCameras.length > 1 && (
                  <select
                    value={selectedDeviceId}
                    onChange={(e) => {
                      setSelectedDeviceId(e.target.value);
                      if (cameraActive) startCamera(null, e.target.value);
                    }}
                    className="rounded-lg bg-slate-800 px-2.5 py-1 text-xs text-slate-200 border border-slate-700"
                  >
                    <option value="">Kamera Otomatis</option>
                    {availableCameras.map((cam, idx) => (
                      <option key={cam.deviceId || idx} value={cam.deviceId}>
                        {cam.label || `Kamera ${idx + 1}`}
                      </option>
                    ))}
                  </select>
                )}

                <button
                  type="button"
                  onClick={() => {
                    const nextFacing = cameraFacing === "environment" ? "user" : "environment";
                    setCameraFacing(nextFacing);
                    if (cameraActive) startCamera(nextFacing);
                  }}
                  className="flex items-center gap-1 rounded-lg bg-slate-800 px-2.5 py-1 text-xs font-medium text-slate-200 hover:bg-slate-700"
                >
                  <RefreshCw className="h-3.5 w-3.5" />
                  {cameraFacing === "environment" ? "Kamera Belakang" : "Kamera Depan"}
                </button>

                {!cameraActive ? (
                  <button
                    type="button"
                    onClick={() => startCamera()}
                    disabled={cameraStarting}
                    className="flex items-center gap-1.5 rounded-lg bg-emerald-500 px-3 py-1.5 text-xs font-bold text-slate-950 hover:bg-emerald-400 disabled:opacity-50"
                  >
                    <Camera className="h-3.5 w-3.5" />
                    {cameraStarting ? "Menghubungkan..." : "Mulai Kamera"}
                  </button>
                ) : (
                  <button
                    type="button"
                    onClick={stopCamera}
                    className="flex items-center gap-1.5 rounded-lg bg-rose-500 px-3 py-1.5 text-xs font-bold text-white hover:bg-rose-600"
                  >
                    <X className="h-3.5 w-3.5" /> Hentikan
                  </button>
                )}

                <input
                  ref={qrImageInputRef}
                  type="file"
                  accept="image/*"
                  onChange={handleScanFromImage}

                />
                <button
                  type="button"
                  onClick={() => qrImageInputRef.current?.click()}

                  <Upload className="h-3.5 w-3.5" /> Scan Foto QR

            <div className="relative flex aspect-video w-full items-center justify-center bg-slate-900 overflow-hidden">
              <canvas ref={canvasRef} className="hidden" />
              <video
                ref={videoRef}
                playsInline
                muted
                autoPlay
                className={`h-full w-full object-cover transition-opacity duration-300 ${
                  cameraActive ? "opacity-100" : "opacity-0 pointer-events-none absolute inset-0"
                }`}
              />

              {cameraActive && (
                <div className="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
                  <div className="relative h-56 w-56 rounded-2xl border-2 border-cyan-400 shadow-[0_0_0_9999px_rgba(15,23,42,0.45)]">
                    <div className="absolute -left-1 -top-1 h-6 w-6 border-l-4 border-t-4 border-cyan-300 rounded-tl-lg" />
                    <div className="absolute -right-1 -top-1 h-6 w-6 border-r-4 border-t-4 border-cyan-300 rounded-tr-lg" />
                    <div className="absolute -bottom-1 -left-1 h-6 w-6 border-b-4 border-l-4 border-cyan-300 rounded-bl-lg" />
                    <div className="absolute -bottom-1 -right-1 h-6 w-6 border-b-4 border-r-4 border-cyan-300 rounded-br-lg" />
                    <div className="absolute inset-x-0 top-1/2 h-0.5 bg-cyan-400 shadow-[0_0_12px_#22d3ee] animate-pulse" />
                  </div>
                  <div className="mt-3 flex items-center gap-2 rounded-full bg-slate-950/85 px-3.5 py-1 text-[11px] font-mono font-bold text-cyan-300 border border-cyan-500/30">
                    <span className="h-2 w-2 rounded-full bg-emerald-400 animate-ping" />
                    Auto-Scanner Aktif (Frame #{frameScanCount}) • Arahkan QR Kartu ke Kotak
                  </div>
                </div>
              )}

              {!cameraActive && (
                <div className="flex flex-col items-center justify-center p-6 text-center max-w-md z-10">
                  <div className="mb-3 rounded-2xl bg-slate-800/90 p-4 text-cyan-400 ring-1 ring-slate-700">
                    <QrCode className="h-12 w-12" />
                  </div>
                  <p className="text-sm font-bold text-slate-200">
                    {cameraStarting ? "Sedang Menghubungkan ke Kamera Perangkat..." : "Arahkan Kartu QR Peserta Didik ke Kamera"}
                  </p>
                  <p className="mt-1 text-xs text-slate-400">
                    Klik tombol <strong>"Mulai Kamera"</strong> di atas untuk mengaktifkan webcam laptop/kamera HP, atau gunakan <strong>Simulator Scan Cepat</strong> di sebelah kanan.
                  </p>
                  {cameraError && (
                    <div className="mt-3 rounded-xl border border-amber-500/40 bg-amber-500/10 p-3 text-xs text-amber-300">
                      {cameraError}
                    </div>
                  )}
                  <div className="mt-4 flex flex-wrap justify-center gap-2">
                    <button
                      type="button"
                      onClick={() => startCamera()}
                      className="flex items-center gap-2 rounded-xl bg-cyan-500 px-4 py-2 text-xs font-extrabold text-slate-950 hover:bg-cyan-400"
                    >
                      <Camera className="h-4 w-4" /> Aktifkan Kamera Sekarang
                    </button>
                    <button
                      type="button"
                      onClick={() => qrImageInputRef.current?.click()}
                      className="flex items-center gap-2 rounded-xl border border-slate-700 bg-slate-800 px-4 py-2 text-xs font-bold text-slate-200 hover:bg-slate-700"
                    >
                      <Upload className="h-4 w-4 text-cyan-400" /> Upload Gambar QR
                    </button>
                  </div>
                </div>
              )}
            </div>

            <div className="border-t border-slate-800 bg-slate-900/90 p-4">
              <form
                onSubmit={(e) => {
                  e.preventDefault();
                  processQRToken(manualToken);
                  setManualToken("");
                }}
                className="flex gap-2"
              >
                <input
                  type="text"
                  value={manualToken}
                  onChange={(e) => setManualToken(e.target.value)}
                  placeholder="Ketik / Scan Token QR atau NIS (contoh: SIAKAD-QR-STD009-4C8B2F atau 2401009)..."
                  className="flex-1 rounded-xl border border-slate-700 bg-slate-950 px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:border-cyan-400 focus:outline-none"
                />
                <button
                  type="submit"
                  className="rounded-xl bg-blue-600 px-4 py-2 text-xs font-bold text-white hover:bg-blue-500"
                >
                  Proses Token
                </button>
              </form>
            </div>
          </div>

          {scanResult && (
            <div className={`rounded-2xl border-2 p-5 shadow-md transition-all ${bannerStyles[scanResult.type]}`}>
              <div className="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div className="flex items-start gap-4">
                  {scanResult.student ? (
                    <img
                      src={scanResult.student.avatar}
                      alt={scanResult.student.name}
                      className="h-16 w-16 rounded-2xl object-cover ring-4 ring-white shadow-md"
                    />
                  ) : (
                    <div className="flex h-16 w-16 items-center justify-center rounded-2xl bg-rose-200 text-rose-700">
                      <Ban className="h-8 w-8" />
                    </div>
                  )}
                  <div>
                    <span className="inline-block rounded-md bg-white/80 px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider">
                      WAKTU SCAN: {scanResult.timestamp} WIB
                    </span>
                    <h4 className="mt-1 text-base font-extrabold">{scanResult.title}</h4>
                    {scanResult.student && (
                      <p className="text-sm font-bold">
                        {scanResult.student.name} — <span className="font-mono">{scanResult.student.className}</span> (NIS: {scanResult.student.nis})
                      </p>
                    )}
                    <p className="mt-0.5 text-xs opacity-90">{scanResult.subtitle}</p>
                    <div className="mt-3 flex flex-wrap gap-2">
                      <button
                        type="button"
                        onClick={() => setActiveMenu("reports")}
                        className="rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-bold text-white hover:bg-slate-800"
                      >
                        Lihat di Laporan & Rekap →
                      </button>
                      <button
                        type="button"
                        onClick={() => setActiveMenu("attendance_data")}
                        className="rounded-lg bg-white/80 border border-slate-300 px-3 py-1.5 text-xs font-bold text-slate-800 hover:bg-white"
                      >
                        Lihat Tabel Kehadiran Hari Ini
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>

        <div className="space-y-4 lg:col-span-5">
          <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div className="mb-3 flex items-center justify-between">
              <div>
                <h3 className="text-base font-bold text-slate-900">Simulator Scan Cepat (Uji Instan)</h3>
                <p className="text-xs text-slate-500">
                  Klik kartu peserta didik di bawah untuk mensimulasikan pemindaian QR Code secara langsung:
                </p>
              </div>
              <span className="rounded-lg bg-blue-50 px-2.5 py-1 text-xs font-bold text-blue-700">1-Klik Scan</span>
            </div>

            <div className="max-h-96 space-y-2 overflow-y-auto pr-1">
              {students.map((stu) => {
                const rec = todayAttendance.find(a => a.studentId === stu.id);
                return (
                  <div
                    key={stu.id}
                    className="flex items-center justify-between rounded-xl border border-slate-200 p-3 transition hover:border-blue-400 hover:bg-blue-50/30"
                  >
                    <div className="flex items-center gap-3 min-w-0">
                      <img src={stu.avatar} alt={stu.name} className="h-10 w-10 rounded-full object-cover" />
                      <div className="min-w-0">
                        <p className="truncate text-xs font-bold text-slate-900">{stu.name}</p>
                        <p className="text-[11px] text-slate-500">{stu.className} • NIS {stu.nis}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      {rec && <StatusBadge status={rec.status} />}
                      <button
                        type="button"
                        onClick={() => processQRToken(stu.qrToken)}
                        className="flex items-center gap-1 rounded-lg bg-slate-900 px-3 py-1.5 text-xs font-bold text-white hover:bg-blue-600"
                      >
                        <QrCode className="h-3.5 w-3.5" /> Scan QR
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>

            <div className="mt-4 border-t border-slate-100 pt-3">
              <button
                type="button"
                onClick={() => processQRToken("QR-TOKEN-PALSU-99999")}
                className="w-full rounded-xl border border-rose-200 bg-rose-50 py-2 text-xs font-bold text-rose-700 hover:bg-rose-100"
              >
                Simulasikan Scan QR Tidak Valid (Indikator Merah)
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// TOP-LEVEL MODULE 3: MANAJEMEN DATA PESERTA DIDIK
// ============================================================================
function StudentsView({
  settings, students, setStudents, classes, majors, todayStr,
  hasPermission, addActivityLog, showToast
}) {
  const isSMP = settings?.schoolLevel === "SMP";
  const [searchQuery, setSearchQuery] = useState("");
  const [filterClass, setFilterClass] = useState("ALL");
  const [filterMajor, setFilterMajor] = useState("ALL");
  const [showModal, setShowModal] = useState(false);
  const [editingStudent, setEditingStudent] = useState(null);
  const [detailStudent, setDetailStudent] = useState(null);

  const filteredStudents = useMemo(() => {
    return students.filter(s => {
      const matchesSearch =
        s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.nis.includes(searchQuery) ||
        s.nisn.includes(searchQuery);
      const matchesClass = filterClass === "ALL" || s.className === filterClass;
      const matchesMajor = filterMajor === "ALL" || s.major === filterMajor;
      return matchesSearch && matchesClass && matchesMajor;
    });
  }, [students, searchQuery, filterClass, filterMajor]);

  const handleSaveStudent = (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const payload = {
      nis: formData.get("nis"),
      nisn: formData.get("nisn"),
      name: formData.get("name"),
      gender: formData.get("gender"),
      ttl: formData.get("ttl"),
      address: formData.get("address"),
      parentName: formData.get("parentName"),
      parentPhone: formData.get("parentPhone"),
      className: formData.get("className"),
      major: formData.get("major"),
      yearIn: formData.get("yearIn"),
      status: formData.get("status"),
      avatar: formData.get("avatar") || editingStudent?.avatar || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150",
    };

    if (editingStudent) {
      setStudents(prev =>
        prev.map(s => (s.id === editingStudent.id ? { ...s, ...payload } : s))
      );
      addActivityLog("Mengedit Data Peserta Didik", `${payload.name} (${payload.nis})`, "Master Data");
      showToast(`Data ${payload.name} berhasil diperbarui & tersimpan!`);
    } else {
      const nextNum = students.reduce((max, s) => {
        const m = parseInt(String(s.id).replace(/\D/g, ''), 10);
        return Number.isNaN(m) ? max : Math.max(max, m);
      }, 0) + 1;
      const newId = `STD-${String(nextNum).padStart(3, '0')}`;
      const randomHash = Math.random().toString(16).substring(2, 8).toUpperCase();
      const newStudent = {
        id: newId,
        ...payload,
        qrToken: `SIAKAD-QR-${newId.replace('-', '')}-${randomHash}`
      };
      setStudents(prev => [newStudent, ...prev]);
      addActivityLog("Menambah Peserta Didik & Generate QR Unik", `${payload.name} (${newStudent.qrToken})`, "Master Data");
      showToast(`Peserta didik ${payload.name} & QR Code unik berhasil dibuat & tersimpan!`);
    }
    setShowModal(false);
    setEditingStudent(null);
  };

  const handleDeleteStudent = (stu) => {
    setStudents(prev => prev.filter(s => s.id !== stu.id));
    addActivityLog("Menghapus Data Peserta Didik", `${stu.name} (${stu.nis})`, "Master Data");
    showToast(`Peserta didik ${stu.name} telah dihapus.`, "warning");
  };

  const handleExportCSV = () => {
    const headers = ["NIS,NISN,Nama Lengkap,L/P,Kelas,Jurusan,Nama Wali,No HP Wali,Token QR,Status"];
    const rows = filteredStudents.map(s =>
      `"${s.nis}","${s.nisn}","${s.name}","${s.gender}","${s.className}","${s.major}","${s.parentName}","${s.parentPhone}","${s.qrToken}","${s.status}"`
    );
    const csvContent = "\uFEFF" + [headers, ...rows].join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `Data_Peserta_Didik_${todayStr}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("Data Peserta Didik berhasil diekspor ke CSV/Excel!");
  };

  return (
    <div className="space-y-6">
      <div className="flex flex-col justify-between gap-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:flex-row sm:items-center">
        <div>
          <h2 className="text-xl font-bold text-slate-900">Manajemen Data Peserta Didik</h2>
          <p className="text-xs text-slate-500">
            Total {filteredStudents.length} peserta didik terdaftar dengan token QR Code unik terenkripsi.
          </p>
        </div>
        <div className="flex flex-wrap items-center gap-2.5">
          <button
            type="button"
            onClick={handleExportCSV}
            className="flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50"
          >
            <Download className="h-4 w-4 text-emerald-600" /> Export CSV/Excel
          </button>
          {hasPermission("manage_students") && (
            <button
              type="button"
              onClick={() => { setEditingStudent(null); setShowModal(true); }}
              className="flex items-center gap-1.5 rounded-xl bg-blue-600 px-4 py-2 text-xs font-bold text-white shadow-sm hover:bg-blue-700"
            >
              <Plus className="h-4 w-4" /> Tambah Peserta Didik
            </button>
          )}
        </div>
      </div>

      <div className="grid grid-cols-1 gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-4">
        <div className="relative md:col-span-2">
          <Search className="absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" />
          <input
            type="text"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="Cari nama peserta didik, NIS, atau NISN..."
            className="w-full rounded-xl border border-slate-200 bg-slate-50 pl-10 pr-4 py-2 text-xs focus:border-blue-500 focus:bg-white focus:outline-none"
          />
        </div>
        <select
          value={filterClass}
          onChange={(e) => setFilterClass(e.target.value)}
          className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-700"
        >
          <option value="ALL">Semua Kelas</option>
          {classes.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
        </select>
        {!isSMP && (
          <select
            value={filterMajor}
            onChange={(e) => setFilterMajor(e.target.value)}
            className="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-xs font-medium text-slate-700"
          >
            <option value="ALL">Semua Jurusan</option>
            {majors.map(m => <option key={m.id} value={m.code}>{m.code} - {m.name}</option>)}
          </select>
        )}
      </div>

      <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div className="overflow-x-auto">
          <table className="w-full text-left border-collapse">
            <thead>
              <tr className="border-b border-slate-200 bg-slate-50 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                <th className="py-3.5 px-4">Peserta Didik</th>
                <th className="py-3.5 px-4">NIS / NISN</th>
                <th className="py-3.5 px-4">{isSMP ? "Kelas" : "Kelas & Jurusan"}</th>
                <th className="py-3.5 px-4">Orang Tua / Wali</th>
                <th className="py-3.5 px-4">Token QR Code</th>
                <th className="py-3.5 px-4">Status</th>
                <th className="py-3.5 px-4 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100 text-sm">
              {filteredStudents.map((stu) => (
                <tr key={stu.id} className="hover:bg-slate-50/80">
                  <td className="py-3.5 px-4">
                    <div className="flex items-center gap-3">
                      <img src={stu.avatar} alt={stu.name} className="h-10 w-10 rounded-full object-cover ring-2 ring-slate-100" />
                      <div>
                        <div className="font-bold text-slate-900">{stu.name}</div>
                        <div className="text-xs text-slate-500">{stu.gender === "L" ? "Laki-laki" : "Perempuan"} • {stu.ttl}</div>
                      </div>
                    </div>
                  </td>
                  <td className="py-3.5 px-4 font-mono text-xs">
                    <div className="font-bold text-slate-800">{stu.nis}</div>
                    <div className="text-slate-500">{stu.nisn}</div>
                  </td>
                  <td className="py-3.5 px-4">
                    <span className="rounded-md bg-blue-50 px-2.5 py-1 text-xs font-bold text-blue-700">{stu.className}</span>
                  </td>
                  <td className="py-3.5 px-4 text-xs">
                    <div className="font-semibold text-slate-800">{stu.parentName}</div>
                    <div className="text-slate-500">{stu.parentPhone}</div>
                  </td>
                  <td className="py-3.5 px-4">
                    <span className="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-slate-50 px-2.5 py-1 font-mono text-[11px] font-semibold text-slate-700">
                      <QrCode className="h-3.5 w-3.5 text-blue-600" />
                      {stu.qrToken}
                    </span>
                  </td>
                  <td className="py-3.5 px-4">
                    <span className={`inline-flex rounded-full px-2.5 py-0.5 text-xs font-bold ${
                      stu.status === "Aktif" ? "bg-emerald-100 text-emerald-800" : "bg-slate-200 text-slate-700"
                    }`}>
                      {stu.status}
                    </span>
                  </td>
                  <td className="py-3.5 px-4 text-right">
                    <div className="inline-flex items-center gap-1">
                      <button
                        type="button"
                        onClick={() => setDetailStudent(stu)}
                        className="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 hover:text-blue-600"
                      >
                        <Eye className="h-4 w-4" />
                      </button>
                      {hasPermission("manage_students") && (
                        <>
                          <button
                            type="button"
                            onClick={() => { setEditingStudent(stu); setShowModal(true); }}
                            className="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 hover:text-amber-600"
                          >
                            <Edit className="h-4 w-4" />
                          </button>
                          <button
                            type="button"
                            onClick={() => handleDeleteStudent(stu)}
                            className="rounded-lg p-1.5 text-slate-500 hover:bg-rose-50 hover:text-rose-600"
                          >
                            <Trash2 className="h-4 w-4" />
                          </button>
                        </>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {showModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 p-4 backdrop-blur-xs">
          <div className="max-h-[90vh] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white p-6 shadow-2xl">
            <div className="mb-4 flex items-center justify-between border-b border-slate-100 pb-3">
              <h3 className="text-lg font-bold text-slate-900">
                {editingStudent ? "Edit Data Peserta Didik" : "Tambah Peserta Didik Baru"}
              </h3>
              <button type="button" onClick={() => setShowModal(false)} className="rounded-lg p-1 text-slate-400 hover:bg-slate-100">
                <X className="h-5 w-5" />
              </button>
            </div>
            <form onSubmit={handleSaveStudent} className="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">NIS *</label>
                <input name="nis" required defaultValue={editingStudent?.nis || ""} className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">NISN *</label>
                <input name="nisn" required defaultValue={editingStudent?.nisn || ""} className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
              <div className="sm:col-span-2">
                <label className="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap Peserta Didik *</label>
                <input name="name" required defaultValue={editingStudent?.name || ""} className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Jenis Kelamin</label>
                <select name="gender" defaultValue={editingStudent?.gender || "L"} className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                  <option value="L">Laki-laki</option>
                  <option value="P">Perempuan</option>
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Tempat, Tanggal Lahir</label>
                <input name="ttl" required defaultValue={editingStudent?.ttl || "Jakarta, 10 Januari 2009"} className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs" />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Kelas</label>
                <select name="className" defaultValue={editingStudent?.className || classes[0]?.name} className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                  {classes.map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                </select>
              </div>
              {isSMP ? (
                <input type="hidden" name="major" value="-" />
              ) : (
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Jurusan</label>
                  <select name="major" defaultValue={editingStudent?.major || majors[0]?.code} className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                    {majors.map(m => <option key={m.id} value={m.code}>{m.code} - {m.name}</option>)}
                  </select>
                </div>
              )}
              <div>
